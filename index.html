<style>
  /* ---------------- TOKENS (default: light / Apple-style) ---------------- */
  :root {
    --bg: #ffffff;
    --surface: #f5f5f7;
    --surface-2: #ebebed;
    --text: #1d1d1f;
    --text-dim: #6e6e73;
    --text-mute: #a1a1a6;
    --line: rgba(29,29,31,0.10);
    --line-strong: rgba(29,29,31,0.18);
    --accent: #c9a86a;
    --accent-hi: #b89758;
    --accent-ink: #1d1d1f;

    /* Apple-website font stack: SF Pro Display for headlines, SF Pro Text for body.
       Falls back to the system font on Apple devices and Inter elsewhere. */
    --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-italic: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
    --font-mono: 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Monaco, monospace;

    --max: 1440px;
    --pad: clamp(20px, 4vw, 56px);

    --radius: 16px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }

  [data-theme="dark"] {
    --bg: #000000;
    --surface: #1d1d1f;
    --surface-2: #2c2c2e;
    --text: #f5f5f7;
    --text-dim: #a1a1a6;
    --text-mute: #6e6e73;
    --line: rgba(245,245,247,0.10);
    --line-strong: rgba(245,245,247,0.20);
    --accent: #c9a86a;
    --accent-hi: #e3c184;
    --accent-ink: #000000;
  }

  [data-theme="accent"] {
    --bg: #faf6ec;
    --surface: #f3ecd6;
    --surface-2: #ece2c0;
    --text: #1d1d1f;
    --text-dim: #6b5e3a;
    --text-mute: #9a8a5a;
    --line: rgba(29,29,31,0.12);
    --line-strong: rgba(29,29,31,0.22);
    --accent: #b89758;
    --accent-hi: #a07d33;
    --accent-ink: #faf6ec;
  }

  /* type pairings */
  [data-type="editorial"] {
    /* Apple SF Pro — the new default */
    --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
    --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
    --font-italic: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  }
  [data-type="modern"] {
    /* IvyOra display + Inter body — the original brand pairing */
    --font-display: 'IvyOra Display', 'Bodoni Moda', 'Didot', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --font-italic: 'IvyOra Display', 'Bodoni Moda', Georgia, serif;
  }
  [data-type="grotesk"] {
    --font-display: 'Bodoni Moda', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-italic: 'Bodoni Moda', Georgia, serif;
  }

  /* ---------------- BASE ---------------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.47;
    letter-spacing: -0.003em;
    transition: background .4s var(--ease), color .4s var(--ease);
  }
  /* All major display headlines use the brand serif (IvyOra / Bodoni). */
  h1, h2, h3, .hero-h1, .sec-title, .page-title, .pd-title,
  .cta-headline, .manifesto-inner, .about-lead-text, .reel-title,
  .pd-lead, .pd-pull, .footer-mark, .work-name, .step-name, .svc-name,
  .pd-np .name, .contact-info-block .val, form-input::placeholder, .form-text::placeholder {
    font-family: var(--font-display);
    font-feature-settings: 'liga', 'dlig', 'kern';
  }
  /* SF Pro Display calls for tighter tracking and 600 semibold for big headlines */
  .hero-h1, .cta-headline, .page-title, .pd-title { font-weight: 600; letter-spacing: -0.035em; }
  .sec-title, .manifesto-inner, .about-lead-text, .reel-title { font-weight: 600; letter-spacing: -0.025em; }
  .pd-lead { font-weight: 500; letter-spacing: -0.02em; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  img, video { display: block; max-width: 100%; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* utility */
  .wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }
  .mono { font-family: var(--font-mono); font-weight: 400; letter-spacing: 0; }
  .micro { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); }
  .italic-serif { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .rule-strong { border-top-color: var(--line-strong); }

  /* ---------------- NAV ---------------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { padding: 14px var(--pad); }
  .nav-inner {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 18px var(--pad);
    max-width: var(--max);
    margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { height: 28px; width: auto; display: block; }
  @media (max-width: 720px) { .brand-logo { height: 24px; } }

  .nav-links { display: flex; gap: 32px; justify-content: center; }
  .nav-link {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    padding: 6px 0;
    position: relative;
    cursor: pointer;
    transition: color .2s var(--ease);
    background: none; border: 0;
  }
  .nav-link:hover, .nav-link[data-active="true"] { color: var(--text); }
  .nav-link[data-active="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: var(--accent);
  }
  .nav-cta {
    justify-self: end;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500;
    padding: 9px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s var(--ease);
    background: none; color: var(--text);
  }
  .nav-cta:hover { border-color: var(--accent); color: var(--accent); }
  .nav-cta .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.6); }

  /* ---------------- HERO ---------------- */
  .hero { position: relative; padding: clamp(40px, 7vw, 96px) 0 clamp(40px, 6vw, 80px); }
  .hero-meta { display: flex; justify-content: space-between; align-items: end; margin-bottom: 28px; }
  .hero-meta-l { display: flex; gap: 32px; align-items: center; }
  .hero-meta-l span { color: var(--text-dim); }

  .hero-reel {
    position: relative;
    aspect-ratio: 21/9;
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.02);
  }
  .reel-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(201,168,106,0.25), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(120,90,50,0.35), transparent 55%),
      linear-gradient(135deg, #1a1a18, #0a0a0a 70%);
  }
  [data-theme="light"] .reel-bg {
    background:
      radial-gradient(ellipse at 30% 40%, rgba(138,106,42,0.22), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(80,60,30,0.18), transparent 55%),
      linear-gradient(135deg, #d8d5cc, #c4c1b6 70%);
  }
  .reel-grain {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .reel-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(20px, 3vw, 40px);
  }
  .reel-tags { display: flex; gap: 10px; align-items: center; }
  .reel-tag {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text); opacity: 0.7;
    padding: 5px 9px; border: 1px solid rgba(245,243,238,0.25);
    border-radius: 999px;
  }
  [data-theme="light"] .reel-tag, [data-theme="light"] .reel-overlay { color: #f5f3ee; }
  [data-theme="accent"] .reel-overlay { color: #f5e8c8; }

  .reel-play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: clamp(72px, 8vw, 110px); height: clamp(72px, 8vw, 110px);
    border-radius: 50%;
    background: rgba(245,243,238,0.08);
    border: 1px solid rgba(245,243,238,0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all .3s var(--ease);
  }
  .reel-play:hover { background: var(--accent); border-color: var(--accent); transform: translate(-50%,-50%) scale(1.05); }
  .reel-play svg { width: 28%; height: 28%; fill: #f5f3ee; transition: fill .3s; }
  .reel-play:hover svg { fill: var(--accent-ink); }

  .reel-bottom { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
  .reel-title { font-family: var(--font-italic); font-style: italic; font-weight: 400; font-size: clamp(28px, 4vw, 56px); line-height: 0.95; color: #f5f3ee; max-width: 600px; }
  [data-theme="light"] .reel-title { color: #f5f3ee; }
  .reel-runtime { font-family: var(--font-mono); font-size: 12px; color: rgba(245,243,238,0.6); }

  .hero-reel-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }

  .hero-reel-caption {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 16px;
  }

  /* hero headline below reel */
  .hero-headline {
    margin-top: clamp(60px, 8vw, 110px);
    display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 90px);
    align-items: end;
  }
  .hero-h1 {
    font-family: var(--font-display);
    font-size: clamp(42px, 6.5vw, 96px);
    font-weight: 300;
    line-height: 0.98;
    letter-spacing: -0.025em;
    margin: 0;
  }
  .hero-h1 em { font-family: var(--font-italic); font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: 0; }
  .hero-h1 .small { font-size: 0.55em; letter-spacing: -0.01em; display: inline-block; vertical-align: top; padding-top: 0.4em; color: var(--text-dim); font-weight: 300; }

  .hero-side { display: flex; flex-direction: column; gap: 24px; padding-bottom: 12px; }
  .hero-side p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--text-dim); max-width: 42ch; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; padding-top: 24px; border-top: 1px solid var(--line); }
  .hero-stat .num { font-family: var(--font-display); font-size: 32px; font-weight: 400; line-height: 1; letter-spacing: -0.02em; }
  .hero-stat .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); margin-top: 8px; }

  @media (max-width: 860px) {
    .hero-headline { grid-template-columns: 1fr; gap: 36px; }
  }

  /* ---------------- SECTION HEADER ---------------- */
  .sec { padding: clamp(64px, 9vw, 130px) 0; }
  .sec-head {
    display: grid; grid-template-columns: 220px 1fr auto;
    gap: 40px; align-items: end; margin-bottom: clamp(32px, 5vw, 64px);
  }
  .sec-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.08em; text-transform: uppercase; }
  .sec-num b { color: var(--accent); font-weight: 500; }
  .sec-title { font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px); font-weight: 300; letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .sec-title em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .sec-link { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); background: none; border: 0; border-bottom: 1px solid var(--accent); padding-bottom: 4px; cursor: pointer; text-decoration: none; }
  .sec-link:hover { color: var(--accent); }
  @media (max-width: 720px) {
    .sec-head { grid-template-columns: 1fr; gap: 14px; }
  }

  /* ---------------- WORK GRID ---------------- */
  .work-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(20px, 2.4vw, 36px) clamp(16px, 2vw, 28px); }
  .work-card { cursor: pointer; transition: opacity .3s; }
  .work-card:hover .work-thumb-img { transform: scale(1.04); }
  .work-card:hover .work-arrow { transform: translate(4px, -4px); opacity: 1; }
  .work-thumb {
    position: relative;
    aspect-ratio: 16/10;
    background: var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 12px 30px -18px rgba(0,0,0,0.18);
    transition: box-shadow .4s var(--ease);
  }
  .work-card:hover .work-thumb { box-shadow: 0 30px 60px -24px rgba(0,0,0,0.22); }
  .work-card.span-7 { grid-column: span 7; }
  .work-card.span-5 { grid-column: span 5; }
  .work-card.span-6 { grid-column: span 6; }
  .work-card.span-4 { grid-column: span 4; }
  .work-card.span-8 { grid-column: span 8; }
  .work-card.span-12 { grid-column: span 12; }
  .work-card.tall .work-thumb { aspect-ratio: 4/5; }
  .work-card.wide .work-thumb { aspect-ratio: 21/9; }

  .work-thumb-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transition: transform .8s var(--ease);
  }
  .work-arrow {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(10,10,10,0.5); backdrop-filter: blur(6px);
    border: 1px solid rgba(245,243,238,0.2);
    display: grid; place-items: center;
    color: #f5f3ee;
    opacity: 0; transition: all .3s var(--ease);
  }
  .work-card:hover .work-arrow { opacity: 1; }

  .work-meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; gap: 16px; }
  .work-name { font-family: var(--font-display); font-size: 18px; font-weight: 500; letter-spacing: -0.005em; }
  .work-name em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .work-info { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
  .work-tags { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  @media (max-width: 900px) {
    .work-card.span-7, .work-card.span-5, .work-card.span-6, .work-card.span-4, .work-card.span-8 { grid-column: span 12; }
  }

  /* ---------------- POSITIONING / MANIFESTO ---------------- */
  .manifesto { padding: clamp(80px, 12vw, 160px) 0; }
  .manifesto-inner {
    max-width: 1100px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(32px, 4.4vw, 64px);
    line-height: 1.12;
    letter-spacing: -0.022em;
  }
  .manifesto-inner em { font-family: var(--font-italic); font-style: italic; font-weight: 500; color: var(--accent); }

  /* ---------------- SERVICES ---------------- */
  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }
  .svc {
    padding: 36px 32px 36px 0;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    position: relative;
    cursor: default;
    transition: background .3s;
  }
  .svc:nth-child(3n) { border-right: 0; padding-right: 0; }
  .svc:nth-child(n+1) { padding-left: 32px; }
  .svc:nth-child(3n+1) { padding-left: 0; }
  .svc-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; }
  .svc-name { font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: -0.01em; margin: 14px 0 12px; }
  .svc-name em { font-family: var(--font-italic); font-style: italic; }
  .svc-desc { font-size: 14px; color: var(--text-dim); line-height: 1.55; margin: 0; max-width: 36ch; }
  .svc-deliver { margin-top: 22px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); }
  .svc:hover { background: color-mix(in oklab, var(--surface) 60%, transparent); }
  @media (max-width: 900px) {
    .services-grid { grid-template-columns: 1fr; }
    .svc, .svc:nth-child(3n) { padding: 28px 0; border-right: 0; }
  }

  /* ---------------- CLIENTS ---------------- */
  .clients-band { padding: clamp(40px, 6vw, 70px) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; background: var(--surface); }
  .clients-row {
    display: flex; gap: clamp(40px, 6vw, 80px); align-items: center;
    animation: scroll-x 50s linear infinite;
    width: max-content;
  }
  @keyframes scroll-x {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .client-logo {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
    transition: color .3s;
  }
  .client-logo:hover { color: var(--text); }
  .client-logo .accent-dot { color: var(--accent); }

  /* ---------------- PROCESS ---------------- */
  .process-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .step { padding-top: 24px; border-top: 1px solid var(--line); }
  .step-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; }
  .step-name { font-family: var(--font-display); font-size: 20px; font-weight: 500; letter-spacing: -0.005em; margin: 14px 0 10px; }
  .step-name em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .step-desc { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; margin: 0; }
  @media (max-width: 720px) { .process-grid { grid-template-columns: 1fr 1fr; } }

  /* ---------------- CTA BAND ---------------- */
  .cta-band { padding: clamp(80px, 12vw, 180px) 0; text-align: left; position: relative; overflow: hidden; }
  .cta-headline {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(46px, 8vw, 130px);
    line-height: 0.92; letter-spacing: -0.03em;
    margin: 0;
  }
  .cta-headline em { font-family: var(--font-italic); font-style: italic; font-weight: 400; color: var(--accent); }
  .cta-row { display: flex; justify-content: space-between; align-items: end; margin-top: 48px; gap: 24px; flex-wrap: wrap; }
  .cta-btn {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--accent); color: var(--accent-ink);
    padding: 18px 28px; border-radius: 999px; border: 0; cursor: pointer;
    font-family: var(--font-display); font-weight: 500; font-size: 14px;
    transition: all .25s var(--ease);
  }
  .cta-btn:hover { background: var(--accent-hi); transform: translateY(-1px); }
  .cta-btn .arrow { display: inline-block; transition: transform .3s; }
  .cta-btn:hover .arrow { transform: translate(3px, -3px); }

  /* ---------------- FOOTER ---------------- */
  .footer { border-top: 1px solid var(--line); padding: 48px 0 32px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 56px; }
  .foot-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 16px; }
  .foot-list { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--text-dim); }
  .foot-list a:hover { color: var(--accent); }
  .footer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.04em; }
  .footer-mark-img { margin: 8px 0 36px; }
  .footer-mark-img img { height: clamp(80px, 14vw, 200px); width: auto; opacity: 0.95; }
  @media (max-width: 760px) { .footer-grid { grid-template-columns: 1fr 1fr; } }

  /* ---------------- WORK PAGE ---------------- */
  .page-head { padding: clamp(60px, 8vw, 110px) 0 clamp(36px, 5vw, 64px); }
  .page-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
  .page-title { font-family: var(--font-display); font-size: clamp(48px, 8vw, 110px); font-weight: 300; line-height: 0.95; letter-spacing: -0.03em; margin: 0; }
  .page-title em { font-family: var(--font-italic); font-style: italic; font-weight: 400; color: var(--accent); }
  .page-sub { margin-top: 24px; font-size: 17px; color: var(--text-dim); max-width: 60ch; line-height: 1.55; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: clamp(40px, 5vw, 64px); }
  .filter-chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: none; color: var(--text-dim); cursor: pointer;
    transition: all .2s var(--ease);
  }
  .filter-chip:hover { color: var(--text); border-color: var(--line-strong); }
  .filter-chip[data-active="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---------------- PROJECT DETAIL ---------------- */
  .pd-back { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 36px 0 28px; cursor: pointer; }
  .pd-back:hover { color: var(--accent); }
  .pd-head { padding-bottom: clamp(40px, 6vw, 72px); }
  .pd-meta-top { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
  .pd-meta-top span { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .pd-meta-top span b { color: var(--text); font-weight: 500; }

  .pd-title { font-family: var(--font-display); font-size: clamp(40px, 6vw, 84px); font-weight: 300; letter-spacing: -0.025em; line-height: 0.98; margin: 0; max-width: 18ch; }
  .pd-title em { font-family: var(--font-italic); font-style: italic; font-weight: 400; color: var(--accent); }

  .pd-hero {
    aspect-ratio: 16/9;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line);
    margin-bottom: clamp(48px, 7vw, 96px);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.20);
  }

  .pd-body { display: grid; grid-template-columns: 280px 1fr; gap: clamp(40px, 6vw, 90px); }
  .pd-sidebar { position: sticky; top: 100px; align-self: start; display: flex; flex-direction: column; gap: 28px; }
  .pd-sb-block .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; }
  .pd-sb-block .val { font-family: var(--font-display); font-size: 15px; font-weight: 500; line-height: 1.4; }
  .pd-sb-block ul { margin: 0; padding: 0; list-style: none; }
  .pd-sb-block li { font-size: 13.5px; line-height: 1.7; color: var(--text-dim); }

  .pd-content { max-width: 70ch; }
  .pd-lead { font-family: var(--font-display); font-weight: 300; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.4; letter-spacing: -0.01em; color: var(--text); margin: 0 0 32px; }
  .pd-lead em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .pd-content p { font-size: 15.5px; line-height: 1.75; color: var(--text-dim); margin: 0 0 18px; }

  .pd-pull { font-family: var(--font-italic); font-style: italic; font-weight: 400; font-size: clamp(28px, 3.5vw, 44px); line-height: 1.2; color: var(--text); margin: 48px 0; padding-left: 24px; border-left: 2px solid var(--accent); }
  .pd-pull cite { display: block; margin-top: 18px; font-family: var(--font-mono); font-style: normal; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); }

  .pd-stills { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 32px 0; }
  .pd-still { aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 12px 30px -18px rgba(0,0,0,0.15); }
  .pd-still.wide { grid-column: span 2; aspect-ratio: 16/9; }

  .pd-nextprev { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin-top: clamp(80px, 10vw, 140px); }
  .pd-np {
    background: var(--bg); padding: 36px var(--pad); cursor: pointer;
    transition: background .3s;
  }
  .pd-np:hover { background: var(--surface); }
  .pd-np .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .pd-np .name { font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 32px); font-weight: 400; letter-spacing: -0.015em; }
  .pd-np .name em { font-family: var(--font-italic); font-style: italic; }
  .pd-np.right { text-align: right; }
  @media (max-width: 860px) {
    .pd-body { grid-template-columns: 1fr; }
    .pd-sidebar { position: static; flex-direction: row; flex-wrap: wrap; gap: 28px 36px; }
    .pd-stills { grid-template-columns: 1fr; }
    .pd-still.wide { grid-column: span 1; }
  }

  /* ---------------- ABOUT ---------------- */
  .about-lead { padding: clamp(60px, 9vw, 130px) 0; border-bottom: 1px solid var(--line); }
  .about-lead-text {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(30px, 4.4vw, 60px);
    line-height: 1.1; letter-spacing: -0.022em;
    max-width: 22ch;
  }
  .about-lead-text em { font-family: var(--font-italic); font-style: italic; font-weight: 400; color: var(--accent); }

  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 96px); }
  .about-cap-row { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .about-cap-row:first-child { border-top: 1px solid var(--line); }
  .about-cap-row .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); padding-top: 6px; }
  .about-cap-row .val { font-family: var(--font-display); font-size: 18px; font-weight: 400; line-height: 1.4; }

  .about-portrait {
    aspect-ratio: 4/5; border-radius: 22px; overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.18);
  }
  .about-cycle { position: relative; width: 100%; height: 100%; }
  .about-cycle-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.9s ease; }
  .about-cycle-ui { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px; display: flex; justify-content: space-between; background: linear-gradient(to top, rgba(0,0,0,0.45), transparent); z-index: 2; }

  /* ---------------- CONTACT ---------------- */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 96px); padding: clamp(40px, 6vw, 80px) 0 120px; }
  .form-row { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .form-row:first-child { border-top: 1px solid var(--line); }
  .form-row .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); padding-top: 6px; }
  .form-input, .form-text {
    width: 100%; background: none; border: 0;
    font-family: var(--font-display); font-size: 17px; color: var(--text);
    padding: 6px 0; outline: none;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  .form-input:focus, .form-text:focus { border-bottom-color: var(--accent); }
  .form-input::placeholder, .form-text::placeholder { color: var(--text-mute); font-family: var(--font-italic); font-style: italic; font-size: 18px; }
  .form-text { resize: vertical; min-height: 96px; }
  .form-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .form-chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
    font-size: 12.5px; color: var(--text-dim); background: none;
    transition: all .15s;
  }
  .form-chip[data-on="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .form-chip:hover { border-color: var(--line-strong); color: var(--text); }
  .form-chip[data-on="true"]:hover { color: var(--accent-ink); }

  .form-submit {
    margin-top: 32px;
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--text); color: var(--bg);
    padding: 18px 32px; border-radius: 999px; border: 0; cursor: pointer;
    font-family: var(--font-display); font-weight: 500; font-size: 14px;
    transition: all .25s var(--ease);
  }
  .form-submit:hover { background: var(--accent); color: var(--accent-ink); }

  .contact-info { display: flex; flex-direction: column; gap: 36px; }
  .contact-info-block .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 12px; }
  .contact-info-block .val { font-family: var(--font-display); font-size: 22px; font-weight: 300; line-height: 1.35; letter-spacing: -0.005em; }
  .contact-info-block .val em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }

  @media (max-width: 800px) {
    .contact-grid, .about-grid { grid-template-columns: 1fr; }
    .form-row, .about-cap-row { grid-template-columns: 1fr; gap: 8px; }
  }

  /* ---------------- SECTION BANDS (segmentation) ---------------- */
  .band { position: relative; }
  .band-soft { background: var(--surface); }
  .band-soft-2 { background: var(--surface-2); }
  .band-tint {
    background: linear-gradient(180deg,
      color-mix(in oklab, var(--accent) 8%, var(--bg)) 0%,
      color-mix(in oklab, var(--accent) 4%, var(--bg)) 100%);
  }
  .band-ink { background: #1d1d1f; color: #f5f5f7; }
  .band-ink .sec-title, .band-ink .sec-num, .band-ink h2, .band-ink p { color: inherit; }
  .band-ink .step, .band-ink .about-cap-row { border-color: rgba(245,245,247,0.14); }
  .band-ink .step-desc, .band-ink p { color: rgba(245,245,247,0.7); }

  /* Card panel — Apple-style rounded surface used inside soft bands */
  .panel {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: clamp(40px, 5vw, 72px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 30px 60px -40px rgba(0,0,0,0.10);
  }
  .panel-tight { padding: clamp(28px, 3vw, 44px); border-radius: 22px; }

  /* When a band wraps a .sec, neutralize the sec's own padding-top spacing */
  .band > .sec:first-child { padding-top: clamp(64px, 9vw, 130px); }

  /* manifesto sits in a tinted band now */
  .band-tint .manifesto { padding: clamp(80px, 12vw, 160px) 0; }

  /* services panel grid sits inside soft band */
  .band-soft .services-grid { background: var(--bg); border-radius: 28px; border: 1px solid var(--line); overflow: hidden; box-shadow: 0 30px 60px -40px rgba(0,0,0,0.10); }
  .band-soft .services-grid .svc { padding: 36px 32px; }
  .band-soft .services-grid .svc:nth-child(3n+1) { padding-left: 32px; }
  .band-soft .services-grid .svc:nth-child(3n) { padding-right: 32px; }

  /* process steps as cards inside ink band */
  .band-ink .process-grid { gap: 18px; }
  .band-ink .step {
    padding: 28px;
    border-top: 0;
    border-radius: 22px;
    background: rgba(245,245,247,0.04);
    border: 1px solid rgba(245,245,247,0.10);
  }

  /* CTA pill button — Apple-flavoured */
  .cta-btn { padding: 16px 26px; font-weight: 500; box-shadow: 0 8px 24px -10px rgba(201,168,106,0.6); }
  .form-submit { padding: 16px 28px; font-weight: 500; }
  .nav-cta { padding: 8px 16px; font-weight: 500; }

  /* mobile floating buttons */
  .mobile-float { display: none; }
  @media (max-width: 720px) {
    .nav-mobile-hide { display: none !important; }
    .mobile-float {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      position: fixed; bottom: 28px; left: 20px; z-index: 150;
    }
    .mobile-float-btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.75);
      color: #1a1a1a;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transition: all .2s;
    }
    [data-theme="dark"] .mobile-float-btn {
      background: rgba(30,30,30,0.80);
      border-color: rgba(255,255,255,0.12);
      color: #f5f3ee;
    }
  }

  /* ---------------- DECORATIVE THUMB GENERATORS ---------------- */
  /* Each project gets a unique cinematic gradient based on its slot */
  .thumb-1 { background: linear-gradient(135deg, #2a2218 0%, #6b4a22 50%, #c9a86a 100%); }
  .thumb-2 { background: linear-gradient(160deg, #142028 0%, #1f4055 50%, #5a8da8 100%); }
  .thumb-3 { background: linear-gradient(120deg, #2c1820 0%, #5a2a35 60%, #9a4a55 100%); }
  .thumb-4 { background: linear-gradient(135deg, #1a1f1a 0%, #2a3d2e 60%, #6b8a55 100%); }
  .thumb-5 { background: linear-gradient(165deg, #18181a 0%, #2a2a3a 50%, #4a4a6a 100%); }
  .thumb-6 { background: linear-gradient(140deg, #2a1818 0%, #5a2818 60%, #c87a3a 100%); }
  .thumb-7 { background: linear-gradient(125deg, #181a22 0%, #2a3550 50%, #6090c0 100%); }
  .thumb-8 { background: linear-gradient(150deg, #1a1818 0%, #3a2818 60%, #785a38 100%); }
  .thumb-9 { background: linear-gradient(130deg, #281820 0%, #482238 60%, #885070 100%); }
  .thumb-10 { background: linear-gradient(155deg, #1a2218 0%, #2a3a28 50%, #5a8050 100%); }
  .thumb-11 { background: linear-gradient(135deg, #181820 0%, #28283a 50%, #5050a0 100%); }
  .thumb-12 { background: linear-gradient(170deg, #221820 0%, #382838 50%, #604060 100%); }

  .thumb {
    width: 100%; height: 100%;
    position: relative;
    display: flex; align-items: end; justify-content: space-between;
    padding: 18px;
    color: #f5f3ee;
  }
  .thumb::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.0) 0 1px, rgba(255,255,255,0.012) 1px 3px);
    mix-blend-mode: overlay; pointer-events: none;
  }
  .thumb::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 50%);
    pointer-events: none;
  }
  .thumb-corners { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: rgba(245,243,238,0.7); z-index: 2; }
  .thumb-tag { position: relative; z-index: 2; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,243,238,0.85); padding: 5px 9px; border: 1px solid rgba(245,243,238,0.25); border-radius: 999px; backdrop-filter: blur(4px); }
  .thumb-name { position: relative; z-index: 2; font-family: var(--font-italic); font-style: italic; font-weight: 400; font-size: clamp(20px, 2.2vw, 32px); line-height: 1; color: #f5f3ee; }

  /* notes ribbon (designer rationale) */
  .notes-ribbon {
    position: fixed; left: 16px; bottom: 16px; z-index: 30;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: all .2s;
  }
  .notes-ribbon:hover { color: var(--text); border-color: var(--accent); }
  .notes-ribbon .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .notes-modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    display: grid; place-items: center; padding: 24px;
    animation: fade .25s var(--ease);
  }
  .notes-modal {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 4px;
    max-width: 760px; width: 100%; max-height: 88vh; overflow: auto;
    padding: 48px 56px;
  }
  .notes-modal h2 { font-family: var(--font-display); font-weight: 300; font-size: 36px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .notes-modal h2 em { font-family: var(--font-italic); font-style: italic; color: var(--accent); }
  .notes-modal .note-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
  .notes-modal .note-block { padding: 22px 0; border-top: 1px solid var(--line); }
  .notes-modal .note-block:first-of-type { margin-top: 24px; }
  .notes-modal .note-block .num { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.06em; }
  .notes-modal .note-block h3 { font-family: var(--font-display); font-size: 19px; font-weight: 500; letter-spacing: -0.005em; margin: 6px 0 10px; }
  .notes-modal .note-block h3 em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .notes-modal .note-block p { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--text-dim); }
  .notes-modal .note-block .before { color: var(--text-mute); }
  .notes-modal .close {
    position: sticky; top: 0; float: right; appearance: none; border: 0; background: none;
    color: var(--text-dim); cursor: pointer; font-size: 22px; line-height: 1;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* lightbox for hero reel */
  .lbx-bg { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.92); display: grid; place-items: center; padding: 24px; animation: fade .2s; }
  .lbx-card { width: 100%; max-width: 1280px; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); position: relative; overflow: hidden; }
  .lbx-close { position: absolute; top: 16px; right: 16px; appearance: none; background: rgba(245,243,238,0.1); border: 1px solid rgba(245,243,238,0.2); color: #f5f3ee; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; z-index: 2; }
  /* photo lightbox */
  .photo-lbx { position: relative; width: min(92vw, 1100px); background: #0d0d0d; border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
  .photo-lbx-img { width: 100%; height: min(72vh, 700px); background-size: contain; background-position: center; background-repeat: no-repeat; background-color: #000; }
  .photo-lbx-controls { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
  .photo-lbx-btn { appearance: none; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f5f3ee; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; transition: background .15s; display: flex; align-items: center; justify-content: center; }
